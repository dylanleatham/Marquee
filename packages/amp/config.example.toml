# Copy to config.toml (same folder) on the Pi. config.toml is gitignored.
# On the dev workstation you can skip this entirely — env vars + defaults are enough.

[server]
port = 4741
host = "0.0.0.0"

[auth]
# Required on every /api/* call via the X-Trigger-Secret header. Same value as the other
# services + Curator. Falls back to $TRIGGER_SHARED_SECRET if omitted here.
shared_secret = "change-me-lan-only-secret"

[storage]
data_dir = "data"             # holds amp.json (the target Sonos room). Keep out of git.
# album_assets_dir = "data/album-assets"   # the rsync target Curator pushes; default {data_dir}/album-assets

[runtime]
idle_timeout_minutes = 90

[sonos]
# The Sonos room or group to play cards on. Can also be pushed at runtime via PUT /api/settings,
# or set with $AMP_TARGET_ROOM. Leave unset to configure it from Curator.
# target_room = "Living Room"
