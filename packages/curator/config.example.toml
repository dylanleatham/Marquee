# Copy to config.toml (gitignored) if you want to override defaults. Env vars also work:
#   CURATOR_PORT, MARQUEE_DATA_DIR
[server]
port = 4739
host = "127.0.0.1"

[storage]
# Root for the album-assets store and media store. Default: ~/marquee
data_dir = "~/marquee"

# Optional — enables /api/spotify/* and JSON add-by-URI. Or use env vars
# SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET (client-credentials flow, no user login).
# [spotify]
# client_id = "..."
# client_secret = "..."

# Optional — enables /api/discogs/* (browse your collection + add). A personal access token from
# https://www.discogs.com/settings/developers (ADR 0016 — not OAuth). Or use env vars
# DISCOGS_TOKEN / DISCOGS_USERNAME. `username` is optional (resolved from the token when omitted).
# [discogs]
# token = "..."
# username = "..."

# How Curator reaches Hue Conductor — for the Demo Room's real lights (ADR 0007) and to push the
# album-assets store (ADR 0045). Defaults shown; or use env vars CONDUCTOR_URL /
# TRIGGER_SHARED_SECRET. The shared secret must match Conductor's [auth].
# [conductor]
# url = "http://localhost:4737"
# shared_secret = "change-me-lan-only-secret"
#
# push_assets: send the album-assets store to Conductor, which is also what Amp reads (ADR 0045).
# Defaults to true whenever `url` is set explicitly, and false otherwise — the default localhost URL
# exists so the Demo Room proxy has somewhere to aim, and pushing to it on a workstation with no
# runtime would put an "unreachable" syncIssue on every album. Env: CURATOR_CONDUCTOR_PUSH_ASSETS.
# push_assets = true

# Backdrop — the video half. Absent → sync disabled. Env: BACKDROP_URL / BACKDROP_MEDIA_DIR /
# BACKDROP_MEDIA_TRANSFER.
# [backdrop]
# url = "http://backdrop.local:4740"
# shared_secret = "change-me-lan-only-secret"
#
# media_dir is the path ON BACKDROP'S HOST that roots the projection's filePath. It is taken
# verbatim — do not give it a Windows path unless Backdrop runs on this machine (issue #166).
# media_dir = "/home/pi/marquee-data/media/visualizers"
#
# How the .mp4 itself gets there (ADR 0038):
#   "none"  — it doesn't; you rsync it. Default, and what every existing setup does.
#   "local" — same machine, copied in-process. (The old sync_media_locally = true.)
#   "push"  — Curator streams it to Backdrop over HTTP, skipping files whose hash already matches.
# media_transfer = "push"

# Stylus — the stand's NFC reader, for the System status page only. Env: STYLUS_URL. Read-only:
# Stylus *produces* scan events and never consumes one, so it never joins a rehearsal fan-out.
# Absent → the status page reports it as not configured.
# [stylus]
# url = "http://stylus.local:4741"
# Sent as X-Trigger-Secret for uniformity, but Stylus's status server does not check it today —
# its /status and /healthz are unauthenticated (stylus-spec §8.3). Harmless; not protection.
# shared_secret = "change-me-lan-only-secret"

# Amp — the room rehearsal's audio leg (ADR 0028). Env: AMP_URL.
# [amp]
# url = "http://runtime-pi.local:4741"
# shared_secret = "change-me-lan-only-secret"
