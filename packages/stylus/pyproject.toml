[project]
name = "marquee-stylus"
version = "0.0.0"
description = "Reads NFC-tagged sleeves and publishes scan events to Conductor + Backdrop. Runs on a Pi Zero 2 W."
requires-python = ">=3.11"
# The core is stdlib-only by design ([ADR 0016]): HTTP over `urllib`, NDEF parsed by hand, config via
# `tomllib`. That's what lets CI (and your workstation) run the whole service with zero runtime deps.
# Everything hardware lives in the `hardware` extra below — see `docs/adrs/0016-*.md`.
dependencies = []

[project.optional-dependencies]
# Install on the Pi Zero only: `pip install '.[hardware]'`. These are imported lazily, at the two
# hardware seams (`reader.create_pn532_reader`, `led.create_led`), so importing `stylus` off-Pi is
# still safe. Blinka is what provides the `board` / `busio` / `digitalio` modules both seams use —
# without it the PN532 driver has nothing to talk to.
hardware = [
    "adafruit-circuitpython-pn532",
    "Adafruit-Blinka",
]
dev = [
    "pytest",
    "pytest-cov",
    "freezegun",       # fake time for the poll loop
    "hypothesis",      # property tests for the state machine
    "responses",       # fake HTTP endpoints
    "jsonschema",      # validate against the shared contracts/*.json
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the package dir on sys.path so `import stylus` works under a bare `pytest` run (CI), without
# an editable install — `pip install -e .` would drag in the Pi-only hardware deps, which don't
# install off-hardware. (`python -m pytest` adds CWD implicitly; plain `pytest` does not.)
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
