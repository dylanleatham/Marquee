[project]
name = "marquee-stylus"
version = "0.0.0"
description = "Reads NFC-tagged sleeves and publishes scan events to Conductor + Backdrop. Runs on a Pi Zero 2 W."
requires-python = ">=3.11"
license = { text = "MIT" }
# The core is stdlib-only by design ([ADR 0016]): HTTP over `urllib`, NDEF parsed by hand, config via
# `tomllib`. That's what lets CI (and your workstation) run the whole service with zero runtime deps.
# Everything hardware lives in the `hardware` extra below — see `docs/adrs/0016-*.md`.
dependencies = []

[project.optional-dependencies]
# Install on the Pi Zero only: `pip install '.[hardware]'`. These are imported lazily, at the two
# hardware seams (`reader.create_pn532_reader`, `led.create_led`), so importing `stylus` off-Pi is
# still safe. Blinka is what provides the `board` / `busio` / `digitalio` modules both seams use —
# without it the PN532 driver has nothing to talk to.
hardware = [
    "adafruit-circuitpython-pn532",
    "Adafruit-Blinka",
]
dev = [
    "pytest",
    "pytest-cov",
    "freezegun",       # fake time for the poll loop
    "hypothesis",      # property tests for the state machine
    "responses",       # fake HTTP endpoints
    "jsonschema",      # validate against the shared contracts/*.json
    # Pinned to match the CI gate in .github/workflows/ci.yml — a local ruff/mypy from a newer minor
    # than CI's would let drift through (or flag what CI won't), which is exactly the confusion these
    # two steps exist to remove. Bump both places together.
    "ruff>=0.15.9,<0.17.0",
    "mypy~=2.3.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the package dir on sys.path so `import stylus` works under a bare `pytest` run, without an
# editable install — CI installs tools by name and never installs the package itself.
# (`python -m pytest` adds CWD implicitly; plain `pytest` does not.)
#
# This used to say `pip install -e .` "would drag in the Pi-only hardware deps". It doesn't:
# `dependencies` is empty and the adafruit/Blinka pins live in the `hardware` extra, so `-e .` and
# `-e '.[dev]'` both install clean off-Pi. The README's dev loop uses `-e '.[dev]'` to get the
# CI-pinned ruff/mypy; this setting is what keeps the *CI* path working without it.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
