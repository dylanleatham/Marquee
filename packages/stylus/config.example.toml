# Copy to ~/stylus/config.toml on the Pi Zero. Do NOT commit the real file.
[reader]
id = "primary"                       # identifies this stand in event payloads
poll_interval_ms = 200
insertion_debounce_polls = 2
removal_debounce_polls = 10
swap_debounce_polls = 1

# How long the one-time PN532 bring-up gets before Stylus gives up and exits so systemd restarts it
# (spec §12, ADR 0076). A healthy init is well under a second; this is generous on purpose. Raise it
# before suspecting it — too tight a bound turns a slow-but-working module into a boot loop, which
# is worse than the hang it guards.
init_timeout_ms = 10000

# Conductor and Backdrop both run on the Pi 5 (runbook §Topology) — same host, different ports.
# Prefer its IP over a `.local` name: mDNS resolves inconsistently across clients, and a name that
# works from one machine and not another is harder to debug than one that never works.
[downstream.conductor]
url = "http://192.168.1.50:4737/api/scan"
# 5s, not 1s: /api/scan doesn't just accept the event, it resolves the album and drives the Hue
# bridge over the network before replying. Measured at ~3s on real hardware. A timeout under that
# fails every scan AND burns all three retries — so Conductor applies the palette three times while
# Stylus reports total failure.
timeout_ms = 5000
shared_secret = "change-me-lan-only-secret"

[downstream.backdrop]
url = "http://192.168.1.50:4740/api/scan"
# Backdrop just accepts and signals the kiosk, so it answers fast. Keep this tight — a downstream
# that is genuinely down should fail quickly rather than stall the poll loop.
timeout_ms = 2000
shared_secret = "change-me-lan-only-secret"

# Audio (ADR 0034). Amp runs on the Pi 5 alongside Conductor and Backdrop, and plays a
# `curator:card:` scan over Sonos; it answers `202 ignored` for a `curator:album:` sleeve, so it is
# safe to wire up even if you only own sleeve tags. **Without this section there is no audio** —
# lights and video will work perfectly and nothing will tell you Amp was never asked.
#
# Note Amp's port is 4741, the same number Stylus's own status server uses below. That is not a
# clash: they are different machines (Amp on the Pi 5, the status server on this Pi Zero).
[downstream.amp]
url = "http://192.168.1.50:4741/api/scan"
# 5s, like Conductor and for the same reason: /api/scan doesn't just accept the event, it resolves
# the album and drives Sonos over UPnP before replying.
timeout_ms = 5000
shared_secret = "change-me-lan-only-secret"

# NOTE: the fan-out is sequential and synchronous inside the poll loop (#173), so the reader is blind
# for the sum of these timeouts. A third downstream widens the worst case: with all three down and
# the §8 retry window, a scan stalls polling for ~36s. Fine while the services are up — a success
# costs one round trip each — but it is why these timeouts are tight rather than generous.

# PN532 transmit drive (ADR 0075). These are NOT the chip's power-on values, and the difference is
# not a nicety: at the chip's default drive (gsn_on = 0xF4, cw_gsp = 0x3F) a tag **overcouples** —
# it detunes the reader's resonant circuit and swamps its receiver, and the reader reports an empty
# field. Measured on the real stand, the chip default read 0/6 at *every* distance from contact out
# to 3cm; the values below read 6/6 across that whole span (issue #303).
#
# It presents as dead hardware, and the cheap checks all say the hardware is fine — the PN532's own
# antenna self-test passes, because it measures the antenna with no tag in the field.
#
# This is the mount/range tuning knob (spec §10). Lower = weaker field = shorter maximum range:
# move DOWN if tags fail when close in (overcoupling), UP if they fail only when far away. The
# settings are volatile, so Stylus reapplies them on every boot; `GET /status` reports what is in
# force under `rf`.
[rf]
gsn_on = 0x84   # N-driver conductance, field on (high nibble CWGsN, low nibble ModGsN)
cw_gsp = 0x18   # P-driver conductance for the continuous wave

[status]
listen_port = 4741

[led]
gpio_pin = 17
enabled = true
