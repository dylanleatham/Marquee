# Monthly and grouped: one PR per ecosystem rather than one per package, so a ~700-package lockfile
# doesn't turn into a stream of PRs, each paying for a full CI run. Security updates are separate
# (Dependabot alerts) and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /packages/stylus
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
