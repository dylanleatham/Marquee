name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [lint, type-check, test:unit, test:integration, build]
        include:
          # The Pi runs Linux but the workstation is Windows, and CI was Linux-only — so
          # platform-specific breakage (path resolution above all) could only ever be found by
          # hand. One Windows leg over the unit tests covers that class; lint/build/integration
          # stay Linux-only to keep the bill down (Windows runners bill at 2x on private repos).
          - os: windows-latest
            task: test:unit
            # This leg flaked twice, for the two halves of one cause (issues #131, #156): a Windows
            # runner has far higher process overhead than Linux, and the suite spawns Node processes
            # from two directions at once. Both need bounding — fixing only the first left it
            # failing at ~1 run in 7, with STATUS_DLL_INIT_FAILED (a process failing to *initialize*)
            # instead of any assertion.
            #
            #   1. Across packages — turbo defaults to ~10 concurrent tasks.
            turboFlags: --concurrency=1
            #   2. Within a package — each `vitest run` forks a pool sized to the CPU count, and no
            #      package configures one. Vitest honours these at config resolution, so one setting
            #      reaches all six vitest packages (curator's own vitest.config.ts included);
            #      review-agents runs `node --test` and ignores them.
            #
            # Not a speed trade, despite what #131 assumed: measured over the full fleet, capping
            # forks ran *faster* (43.3s vs 48.5s) with 32% less system time, because fork-spawn
            # overhead exceeds the parallelism benefit at this suite size.
            vitestForks: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run ${{ matrix.task }} ${{ matrix.turboFlags }}
        env:
          # Unset on every other leg: matrix.vitestForks is undefined there, which renders as the
          # empty string, and vitest's own `if (process.env.VITEST_MAX_FORKS)` guard treats that as
          # absent. Linux keeps its default pool sizing.
          VITEST_MAX_FORKS: ${{ matrix.vitestForks }}
          VITEST_MIN_FORKS: ${{ matrix.vitestForks }}

  # Formatting is a root-level script, not a turbo task, so the matrix above never ran it — which is
  # how 28 files drifted unnoticed (issue #97). `pnpm run validate` covered it, but only for whoever
  # remembered to run it; lint-staged only ever touches files someone happened to stage. Generated
  # files are excluded via .prettierignore rather than fought with.
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  python:
    name: python (stylus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stylus (dev)
        working-directory: packages/stylus
        # Hardware deps (adafruit/pn532) don't install off-Pi; install dev tools + test only.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy jsonschema freezegun hypothesis responses
      - name: Test
        working-directory: packages/stylus
        run: pytest -q
