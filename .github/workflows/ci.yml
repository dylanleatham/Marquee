name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [lint, type-check, test:unit, test:integration, build]
        include:
          # The Pi runs Linux but the workstation is Windows, and CI was Linux-only — so
          # platform-specific breakage (path resolution above all) could only ever be found by
          # hand. One Windows leg over the unit tests covers that class; lint/build/integration
          # stay Linux-only to keep the bill down (Windows runners bill at 2x on private repos).
          - os: windows-latest
            task: test:unit
            # Serialize the packages here (issue #131). Turbo's default ~10 concurrent tasks each
            # spawn a vitest fork pool sized to the CPU count; on a 4-core Windows runner that
            # process storm got a worker killed mid-run ("Worker exited unexpectedly") rather than
            # failing any assertion. Windows process overhead is far higher than Linux, which is why
            # only this leg flaked. It's a platform-bug safety net, not a speed-critical gate, so
            # wall-clock is the right thing to trade for determinism.
            turboFlags: --concurrency=1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run ${{ matrix.task }} ${{ matrix.turboFlags }}

  python:
    name: python (stylus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stylus (dev)
        working-directory: packages/stylus
        # Hardware deps (adafruit/pn532) don't install off-Pi; install dev tools + test only.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy jsonschema freezegun hypothesis responses
      - name: Test
        working-directory: packages/stylus
        run: pytest -q
