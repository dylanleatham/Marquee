name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [lint, type-check, test:unit, test:integration, build]
        include:
          # The Pi runs Linux but the workstation is Windows, and CI was Linux-only — so
          # platform-specific breakage (path resolution above all) could only ever be found by
          # hand. One Windows leg over the unit tests covers that class; lint/build/integration
          # stay Linux-only to keep the bill down (Windows runners bill at 2x on private repos).
          - os: windows-latest
            task: test:unit
            # This leg flaked twice, for the two halves of one cause (issues #131, #156): a Windows
            # runner has far higher process overhead than Linux, and the suite spawns Node processes
            # from two directions at once. Both need bounding — fixing only the first left it
            # failing at ~1 run in 7, with STATUS_DLL_INIT_FAILED (a process failing to *initialize*)
            # instead of any assertion.
            #
            #   1. Across packages — turbo defaults to ~10 concurrent tasks.
            turboFlags: --concurrency=1
            #   2. Within a package — each `vitest run` forks a pool sized to the CPU count, and no
            #      package configures one. Vitest honours these at config resolution, so one setting
            #      reaches all six vitest packages (curator's own vitest.config.ts included);
            #      review-agents runs `node --test` and ignores them.
            #
            # Not a speed trade, despite what #131 assumed: measured over the full fleet, capping
            # forks ran *faster* (43.3s vs 48.5s) with 32% less system time, because fork-spawn
            # overhead exceeds the parallelism benefit at this suite size.
            vitestForks: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Curator's real-binary tests (`test/video-ffmpeg-integration.test.ts`, and the ffmpeg half of
      # `test/card-art-print.test.ts`) skip themselves when ffmpeg is absent — and nothing here ever
      # installed it, so on CI they were *always* skipped, which reads identically to passing. Two
      # defects shipped straight through that hole: #180 (no `-f mp4`, so every real encode died on
      # the muxer) and #217 (the downscale emitted odd dimensions and libx264 refused them). Both
      # were invisible to the faked-prober tests, which assert argv as a string and cannot watch
      # ffmpeg reject it.
      #
      # This runs on `test:integration` rather than `test:unit` on purpose. `test:unit` fans out
      # across the whole monorepo, and a real encode competing for a 2-core runner is exactly what
      # once starved Backdrop's timing-sensitive server/ws tests into a flake (see the note on
      # `makeOverBudgetClip`). Curator is the only package with a `test:integration` script, so this
      # leg has the runner to itself and that contention cannot arise. `test:unit` still runs the
      # same files — with no ffmpeg they skip there, as before, and locally they run in full.
      #
      # Linux only: the class being caught is codec/muxer behaviour, not path handling, so the
      # Windows leg would pay 2x billing for a second copy of the same signal.
      - name: Install ffmpeg
        if: matrix.task == 'test:integration' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm turbo run ${{ matrix.task }} ${{ matrix.turboFlags }}
        env:
          # Unset on every other leg: matrix.vitestForks is undefined there, which renders as the
          # empty string, and vitest's own `if (process.env.VITEST_MAX_FORKS)` guard treats that as
          # absent. Linux keeps its default pool sizing.
          VITEST_MAX_FORKS: ${{ matrix.vitestForks }}
          VITEST_MIN_FORKS: ${{ matrix.vitestForks }}
          # Installing ffmpeg closes the gap today; this is what keeps it closed. On the leg that
          # installed it, a missing binary becomes a hard failure instead of a silent skip, so a
          # broken apt step or a changed runner image goes red rather than quietly green — see
          # `packages/curator/test/ffmpeg-gate.ts`. Empty elsewhere, which the gate reads as absent.
          # Declared in turbo.json's `test:integration` env, without which turbo's strict env mode
          # strips it before vitest ever sees it.
          MARQUEE_REQUIRE_FFMPEG: ${{ matrix.task == 'test:integration' && '1' || '' }}

  # Formatting is a root-level script, not a turbo task, so the matrix above never ran it — which is
  # how 28 files drifted unnoticed (issue #97). `pnpm run validate` covered it, but only for whoever
  # remembered to run it; lint-staged only ever touches files someone happened to stage. Generated
  # files are excluded via .prettierignore rather than fought with.
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  python:
    name: python (stylus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stylus (dev)
        working-directory: packages/stylus
        # Hardware deps (adafruit/pn532) don't install off-Pi; install dev tools + test only.
        #
        # ruff and mypy are compatible-release pinned because the Lint/Type-check steps below make
        # them *gates*: unpinned, a ruff minor promoting a new rule into the default set turns this
        # job red with no commit behind it. `~=` still takes patch fixes, just not the minor that
        # changes what counts as a failure — bump the minor deliberately, with the fixes in the same
        # PR. There's no dependabot for pip here, so nothing bumps these for you. The rest stay
        # unpinned: they only run code that the tests already assert on. Keep in sync with
        # pyproject.toml's [dev] extra and packages/stylus/README.md.
        run: |
          python -m pip install --upgrade pip
          pip install pytest 'ruff~=0.15.9' 'mypy~=2.3.0' jsonschema freezegun hypothesis responses
      # The three steps below are exactly the local loop in packages/stylus/README.md. Until now the
      # job installed ruff and mypy and then ran neither, so both were documented-but-unenforced;
      # `!cancelled()` keeps a failure in one from masking the other two, the same reason the node
      # matrix sets fail-fast: false.
      - name: Test
        working-directory: packages/stylus
        run: pytest -q
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: packages/stylus
        run: ruff check stylus tests
      - name: Type-check
        if: ${{ !cancelled() }}
        working-directory: packages/stylus
        run: mypy stylus
